tls.enabled=true
tls.cert.path=/etc/questdb/tls/server.crt
tls.private.key.path=/etc/questdb/tls/server.key

http.bind.to=0.0.0.0:9000
http.min.bind.to=0.0.0.0:9003
pg.net.bind.to=0.0.0.0:8812
line.tcp.net.bind.to=0.0.0.0:9009

cairo.wal.enabled.default=true
telemetry.enabled=false

# Replication (see core/src/main/java/io/questdb/replication/README.md). The role and the object store
# are usually passed as QDB_REPLICATION_ROLE and QDB_REPLICATION_OBJECT_STORE.
#replication.role=primary
#replication.object.store=s3::bucket=my-bucket;root=my-db;region=us-east-1;
#replication.primary.throttle.window.duration=1000
